name: Build Glasses Solver IPA
on:
  workflow_dispatch:
  push:
    branches: [solver-app]
    paths: ['samples/CameraAccess/**', '.github/workflows/build-solver.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test automatic scan pipeline
        run: |
          set -o pipefail
          xcodebuild test -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.4' \
            -only-testing:CameraAccessTests/AutoScanTests \
            -parallel-testing-enabled NO -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee tests.log
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build.log
      - name: Package for iloader
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/CameraAccess.app package/Payload/
          cd package
          zip -qry ../GlassesSolver-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GlassesSolver-IPA
          path: GlassesSolver-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            tests.log
            TestResults.xcresult
