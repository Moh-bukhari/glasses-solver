name: Build Glasses Solver IPA
on:
  workflow_dispatch:
  push:
    branches: [solver-app]
    paths: ['samples/CameraAccess/**', '.github/workflows/build-solver.yml']
permissions:
  contents: read
concurrency:
  group: solver-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test automatic scan pipeline
        run: |
          set -o pipefail
          # Runner images change their simulators; use an iPhone 17 Pro if present, else any iPhone, on the newest iOS runtime.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          devices = json.load(sys.stdin)['devices']
          def version(key): return [int(n) for n in re.findall(r'\d+', key.split('iOS')[-1])]
          for runtime in sorted((k for k in devices if '.iOS-' in k), key=version, reverse=True):
              phones = [d for d in devices[runtime] if d['name'].startswith('iPhone')]
              if phones:
                  print(next((d for d in phones if d['name'] == 'iPhone 17 Pro'), phones[-1])['udid']); break
          ")
          echo "Simulator: $UDID"; test -n "$UDID"
          xcodebuild test -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme SolverTests -configuration Debug \
            -destination "id=$UDID" \
            -only-testing:CameraAccessTests/AutoScanTests \
            -only-testing:CameraAccessTests/PageSolvingTests \
            -only-testing:CameraAccessTests/HandGestureTests \
            -only-testing:CameraAccessTests/GlassesInputTests \
            -only-testing:CameraAccessTests/FrameCaptureTests \
            -only-testing:CameraAccessTests/MathTextTests \
            -only-testing:CameraAccessTests/CalculatorPictureTests \
            -parallel-testing-enabled NO -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 90 \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            DEVELOPMENT_TEAM="" 2>&1 | tee tests.log
      - name: Export test evidence
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path test-evidence
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            tests.log
            TestResults.xcresult
            test-evidence
  build:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build.log
      - name: Check the Start Glasses Scan shortcut is in the app
        run: |
          # App Shortcuts are read from metadata extracted at build time; without it the Action button cannot find the shortcut.
          app=build/Build/Products/Release-iphoneos/CameraAccess.app
          find "$app" -name '*.appintents' -maxdepth 2 | tee appintents.txt
          test -s appintents.txt
          while read -r dir; do grep -rl "StartScanIntent" "$dir"; done < appintents.txt | grep .
      - name: Package for iloader
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/CameraAccess.app package/Payload/
          cd package
          zip -qry ../GlassesSolver-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GlassesSolver-IPA
          path: GlassesSolver-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
